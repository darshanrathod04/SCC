
spring.application.name=smart-campus
server.port=8080

# --- MySQL Mainframe Connectivity ---
# Added 'createDatabaseIfNotExist' so the system builds itself on first run
spring.datasource.url=jdbc:mysql://localhost:3306/smartcampus?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Performance: Hikari Connection Pool ---
# Ensures the campus portal stays fast under heavy student load
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# --- Persistence Engine (Hibernate) ---
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Resource Optimization (Compression) ---
# Added application/json to ensure your API responses are lightning fast
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# --- Identity & Security Protocol ---
# Increase limits for professional profile picture uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sccmainframe.nagpur@gmail.com
spring.mail.password=rkwqxctcpbcjvibf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Force Spring to look at the actual folder for images
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/

